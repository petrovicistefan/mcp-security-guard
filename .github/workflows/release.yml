name: Release

on:
  push:
    tags: ["v*.*.*"]
  # Publish an existing tag to npm and the MCP Registry (for a release whose publish step did not run).
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, e.g. v0.8.0"
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  test:
    if: ${{ github.event_name == 'push' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: git diff --exit-code -- plugin/dist/
      - run: npm test

  release:
    needs: test
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Version tag matches the plugin manifest
        run: |
          v=$(node -p 'require("./plugin/.claude-plugin/plugin.json").version')
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != plugin.json $v"; exit 1; }
      - name: Package plugin and SBOM
        run: |
          git archive --format=zip --prefix=mcp-security-guard/ -o mcp-security-guard-$GITHUB_REF_NAME.zip HEAD:plugin
          npm run --silent sbom
          sha256sum mcp-security-guard-$GITHUB_REF_NAME.zip sbom.cdx.json > SHA256SUMS
      - name: Signed build provenance
        # Artifact attestations need a public repository (or GitHub Enterprise Cloud).
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            mcp-security-guard-${{ github.ref_name }}.zip
            sbom.cdx.json
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## "v {f=1; next} /^## / {f=0} f' CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" mcp-security-guard-$GITHUB_REF_NAME.zip sbom.cdx.json SHA256SUMS --title "$GITHUB_REF_NAME" --notes "${notes:-See CHANGELOG.md}"

  npm:
    # Publishes with npm Trusted Publishing (OIDC): no token is stored anywhere. On npmjs.com the package's
    # trusted publisher must be this repository and this workflow file (release.yml), with "Allow npm publish" ticked.
    needs: release
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.release.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted Publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@latest
      - name: Versions agree
        run: |
          p=$(node -p 'require("./package.json").version')
          s=$(node -p 'require("./server.json").version')
          q=$(node -p 'require("./server.json").packages[0].version')
          test "v$p" = "$TAG" && test "$s" = "$p" && test "$q" = "$p" || { echo "version mismatch: tag $TAG package $p server.json $s/$q"; exit 1; }
      - name: Publish to npm (OIDC, with provenance)
        run: |
          v=$(node -p 'require("./package.json").version')
          if npm view "mcp-security-guard@$v" version --prefer-online >/dev/null 2>&1; then
            echo "mcp-security-guard@$v is already on npm, not publishing it again"
          else
            npm publish --provenance --access public
          fi
      # npm needs a few minutes to serve a new version, and the MCP Registry checks npm when it validates.
      - name: Wait until npm serves this version
        run: |
          v=$(node -p 'require("./package.json").version')
          for i in $(seq 1 40); do
            npm view "mcp-security-guard@$v" version --prefer-online >/dev/null 2>&1 && { echo "npm serves $v"; exit 0; }
            sleep 15
          done
          echo "npm does not serve $v after 10 minutes"; exit 1
      - name: Publish to the official MCP Registry
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
