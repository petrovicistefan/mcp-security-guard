name: P0 branch validation
on:
  push:
    branches: [fix/p0-file-boundaries]
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Commit validated generated plugin bundles on the fix branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugin/dist/
          if ! git diff --cached --quiet; then
            git commit -m "build: regenerate bundles for validated P0 file boundary fix"
            git push origin HEAD:fix/p0-file-boundaries
          fi
